name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job but `scripts` installs from the lockfile. While devDependencies.hardhat is a link: to a
# local Hardhat checkout (the unreleased includeTraces option, NomicFoundation/hardhat#8824), that
# install fails on a runner; the jobs pass once the link is replaced by a released Hardhat version.
jobs:
  lint:
    name: Lint, format and typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # oxfmt --check, oxlint, then tsc on the package, its tests and the release scripts.
      - run: pnpm run check

  test:
    # Mirrors Hardhat's own matrix (NomicFoundation/hardhat .github/workflows/ci.yml, node:
    # [22.13.0, 24.0.0, 26.0.0]), as hardhat-kms does. Add or drop a leg when Hardhat does.
    name: Test (Linux, Node ${{ matrix.node }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.0.0", "26.0.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Hardhat's solc cache. The plugin tests build the fixture project; with a warm cache they
      # make no request to binaries.soliditylang.org. The key hashes the lockfile too, so a Hardhat
      # upgrade saves a fresh cache.
      - name: Cache Solidity compilers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hardhat-nodejs/compilers-v3
          key: solc-${{ runner.os }}-${{ hashFiles('test/**/*.sol', 'pnpm-lock.yaml') }}
          restore-keys: solc-${{ runner.os }}-
      - run: pnpm test

  # The release scripts import only node: modules and Node 24 strips their types, so this job
  # installs nothing. The tag tests sign real tags with keys made in a throwaway GNUPGHOME, with
  # the runner's gpg.
  scripts:
    name: Release scripts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test "scripts/test/*.test.ts"

  package:
    name: Package checks (publint, attw)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Builds, then publint --strict and are-the-types-wrong (ESM only) on the packed package.
      - run: pnpm run pkg:check

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
